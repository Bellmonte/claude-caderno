<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel de desempenho</title>
<!-- Modelo. Quem preenche é .claude/scripts/registro_desempenho.py, trocando o marcador de dados.
     A cópia gerada em gerencial/desempenho/ é INTERNA e pessoal. -->
<style>
:root{--bg:#F6F7F9;--card:#FFFFFF;--ink:#1A2230;--mute:#6B7585;--line:#DDE2E8;--acc:#2F6F8F;--acc2:#C9DEE8;--warn:#9A6B10;--chip:#EEF1F4}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F141A;--card:#161D25;--ink:#E4E9EF;--mute:#8A95A3;--line:#263140;--acc:#7DB3CC;--acc2:#172832;--warn:#D6A74A;--chip:#1D2630}}
:root[data-theme="dark"]{--bg:#0F141A;--card:#161D25;--ink:#E4E9EF;--mute:#8A95A3;--line:#263140;--acc:#7DB3CC;--acc2:#172832;--warn:#D6A74A;--chip:#1D2630}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Inter","Segoe UI",system-ui,-apple-system,sans-serif}
main{max-width:1180px;margin:0 auto;padding:28px 16px 60px}
h1{font-size:26px;margin:0 0 4px}
.sub{color:var(--mute);margin:0 0 24px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:20px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.kpi b{display:block;font-size:28px;font-variant-numeric:tabular-nums}
.kpi span{color:var(--mute);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px;margin-bottom:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
.card h2{font-size:14px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute);margin:0 0 12px}
.bars{display:flex;align-items:flex-end;gap:6px;height:140px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:11px;color:var(--mute)}
.bars i{display:block;width:100%;background:var(--acc);border-radius:4px 4px 0 0;min-height:2px}
.bars em{font-style:normal;color:var(--ink);font-variant-numeric:tabular-nums}
.hbar{display:grid;grid-template-columns:minmax(120px,40%) 1fr 32px;gap:8px;align-items:center;font-size:13px;margin:5px 0}
.hbar i{display:block;height:10px;background:var(--acc);border-radius:5px}
.hbar em{font-style:normal;text-align:right;font-variant-numeric:tabular-nums}
.filtros{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.filtros input,.filtros select{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
.filtros input{flex:1;min-width:180px}
.lista{display:flex;flex-direction:column;gap:8px}
details{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
summary{cursor:pointer;display:flex;flex-wrap:wrap;gap:8px;align-items:baseline}
summary strong{flex:1;min-width:200px}
.chip{background:var(--chip);border-radius:20px;padding:1px 9px;font-size:12px;color:var(--mute)}
.chip.ab{color:var(--warn)}
dl{display:grid;grid-template-columns:130px 1fr;gap:4px 12px;margin:10px 0 2px;font-size:14px}
dt{color:var(--mute)}dd{margin:0}
.inf{color:var(--mute);font-style:italic}
@media (max-width:560px){dl{grid-template-columns:1fr}dt{margin-top:6px}}
</style>
</head>
<body>
<main>
<h1 id="t">Painel de desempenho</h1>
<p class="sub" id="s"></p>
<section class="kpis" id="kpis"></section>
<section class="grid">
  <div class="card"><h2>Entregas por mês</h2><div class="bars" id="meses"></div></div>
  <div class="card"><h2>Competências exercidas</h2><div id="comp"></div></div>
  <div class="card"><h2>Por frente</h2><div id="frentes"></div></div>
  <div class="card"><h2>Quem viu</h2><div id="vis"></div></div>
</section>
<div class="filtros">
  <input id="q" type="search" placeholder="Buscar entrega, objetivo, impacto…">
  <select id="fs"><option value="">Todos os status</option></select>
  <select id="ff"><option value="">Todas as frentes</option></select>
</div>
<section class="lista" id="lista"></section>
</main>
<script>
const D = /*__DADOS__*/null || {ano:"", gerado:"", linhas:[]};
const L = D.linhas;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const br = iso => iso ? iso.slice(8,10)+"-"+iso.slice(5,7)+"-"+iso.slice(0,4) : "—";
const ent = L.filter(r => r.status.startsWith("entregue"));
const conta = (arr, f) => { const m = new Map(); arr.forEach(r => [].concat(f(r)).forEach(k => k && m.set(k, (m.get(k)||0)+1))); return [...m].sort((a,b)=>b[1]-a[1]); };
const hbars = (el, pares) => { const mx = Math.max(1, ...pares.map(p=>p[1])); $(el).innerHTML = pares.map(([k,v]) => `<div class="hbar"><span>${esc(k)}</span><i style="width:${100*v/mx}%"></i><em>${v}</em></div>`).join("") || '<p class="inf">sem dado</p>'; };

$("t").textContent = "Painel de desempenho " + D.ano;
$("s").textContent = "Derivado das demandas do caderno em " + br(D.gerado) + ". Campo em itálico é inferido do texto e vale como pista.";
const semanal = ent.filter(r => r.visibilidade.includes("reporte semanal")).length;
const kp = [[ent.length,"entregas no ano"],[L.length-ent.length,"em aberto"],
  [ent.filter(r=>r.impacto!=="não registrado").length,"com impacto registrado"],
  [ent.filter(r=>r.feedback!=="não registrado").length,"com algum feedback"],
  [semanal,"chegaram à gestão no semanal"]];
$("kpis").innerHTML = kp.map(([v,k]) => `<div class="kpi"><b>${v}</b><span>${k}</span></div>`).join("");

const nomesMes = ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
const porMes = Array(12).fill(0); ent.forEach(r => r.periodo && porMes[+r.periodo.slice(5,7)-1]++);
const mx = Math.max(1, ...porMes);
$("meses").innerHTML = porMes.map((v,i) => `<div><em>${v||""}</em><i style="height:${100*v/mx}%"></i>${nomesMes[i]}</div>`).join("");
hbars("comp", conta(ent, r => r.competencias_lista).slice(0,8));
hbars("frentes", conta(ent, r => r.frente));
hbars("vis", conta(ent, r => { const v = r.visibilidade, o = [];
  if (v.includes("área solicitante")) o.push("área solicitante");
  if (v.includes("TI / uso interno")) o.push("TI / uso interno");
  if (v.includes("reporte semanal")) o.push("gestão (semanal)");
  if (v.includes("daily")) o.push("daily");
  if (v.includes("reunião")) o.push("reunião");
  if (!o.length) o.push(v.replace(" (inferido)","")); return o; }));

[...new Set(L.map(r=>r.status))].sort().forEach(s => $("fs").add(new Option(s,s)));
[...new Set(L.map(r=>r.frente))].sort().forEach(s => $("ff").add(new Option(s,s)));
const campo = v => /\(inferido\)|não registrado/.test(v) ? `<span class="inf">${esc(v)}</span>` : esc(v);
function desenha(){
  const q = $("q").value.toLowerCase(), fs = $("fs").value, ff = $("ff").value;
  const vis = L.filter(r => (!fs||r.status===fs) && (!ff||r.frente===ff) &&
    (!q || [r.entrega,r.objetivo,r.impacto,r.id,r.competencias].join(" ").toLowerCase().includes(q)))
    .sort((a,b) => (b.periodo||"").localeCompare(a.periodo||""));
  $("lista").innerHTML = vis.map(r => `<details><summary><strong>${esc(r.entrega)}</strong>
    <span class="chip">${esc(r.id)}</span><span class="chip${r.status.startsWith("entregue")?"":" ab"}">${esc(r.status)}</span>
    <span class="chip">${br(r.periodo)}${r.periodo_tipo==="abertura"?" (abertura)":""}</span></summary>
    <dl><dt>Objetivo</dt><dd>${campo(r.objetivo)}</dd><dt>Prioridade</dt><dd>${esc(r.prioridade)}</dd>
    <dt>Impacto</dt><dd>${campo(r.impacto)}</dd><dt>Evidência</dt><dd>${campo(r.evidencia)}</dd>
    <dt>Feedback</dt><dd>${campo(r.feedback)}</dd><dt>Competências</dt><dd>${campo(r.competencias)}</dd>
    <dt>Visibilidade</dt><dd>${campo(r.visibilidade)}</dd><dt>Pasta</dt><dd><code>${esc(r.pasta)}</code></dd></dl></details>`).join("")
    || '<p class="inf">Nada com esse filtro.</p>';
}
["q","fs","ff"].forEach(id => $(id).addEventListener("input", desenha));
desenha();
</script>
</body>
</html>
